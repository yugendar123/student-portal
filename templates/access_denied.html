
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access Denied | Student Portal</title>

    <link rel="stylesheet"
          href="{{ url_for('static', path='/css/access_denied.css') }}">

    
</head>

<body>

    <div class="page-container">

        <div class="error-card">

            <div class="error-icon">
                <span>!</span>
            </div>

            <h1>Access Denied</h1>

            <h2>403 - Forbidden</h2>

            <p>
                Sorry, {{ user.name if user else "User" }}.
                You don't have permission to access this page.
            </p>

            <p class="description">
                This area is restricted to authorized administrators.
                Please contact the administrator if you believe this is a mistake.
            </p>

            <div class="buttons">
                <a href="/dashboard" class="primary-btn">
                    Back to Dashboard
                </a>

                <a href="/log-out" class="secondary-btn">
                    Logout
                </a>
            </div>

            <div class="footer">
                Student Portal &copy; 2026
            </div>

        </div>

    </div>

</body>
</html>
