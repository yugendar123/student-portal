
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Student Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', path='/css/register.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400..900&display=swap"
          rel="stylesheet">
</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <h1 id="mainheading"> Student Portal </h1>
            <h2>Create Student Account</h2>

            <p class="register-description">
                Create your account to access the Student Portal.
            </p>

            {% if error %}
                <p class="error-message">{{ error }}</p>
            {% endif %}

            <form action="/register" method="POST">

                <div class="form-group">
                    <label>Full Name</label>
                    <input
                        type="text"
                        name="name"
                        value="{{ name or '' }}"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input
                        type="email"
                        name="email"
                        value="{{ email or '' }}"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit" class="register-btn">
                    Register
                </button>

            </form>

            <p class="login-link">
                Already have an account?
                <a href="/login">Login here</a>
            </p>
            <div>

            <a class="ll" href="/">Back to Home</a>
        </div>

        </div>

    </div>

</body>
</html>
